<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="烘焙訂單">
<title>🧁 烘焙訂單管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Serif TC',Georgia,serif;background:#fdf6ee;color:#3a2e28;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-size:16px;font-family:inherit;touch-action:manipulation}
button{cursor:pointer;border:none}

.hdr{background:linear-gradient(135deg,#8b5e3c,#c4a35a);padding:24px 20px 20px;text-align:center;box-shadow:0 4px 20px #0002}
.hdr-icon{font-size:36px;margin-bottom:4px}
.hdr-title{font-size:22px;font-weight:700;color:#fff;letter-spacing:2px}
.hdr-date{font-size:12px;color:#ffffffaa;margin-top:2px}

.stats{display:flex;gap:10px;padding:16px 16px 0}
.stat{flex:1;background:#fff;border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 2px 8px #0001}
.stat-val{font-size:22px;font-weight:700}
.stat-lbl{font-size:11px;color:#888;margin-top:2px}

.tabs{display:flex;gap:8px;padding:16px 16px 0}
.tab{flex:1;padding:8px 0;border-radius:20px;background:#fff;color:#8b5e3c;font-weight:600;font-size:13px;box-shadow:0 1px 4px #0001}
.tab.on{background:#8b5e3c;color:#fff}

.prep-box{margin:16px 16px 0;background:#fff3e0;border:1.5px solid #e07b54;border-radius:12px;padding:12px 16px}
.prep-title{font-size:13px;font-weight:700;color:#e07b54;margin-bottom:6px}
.prep-row{font-size:13px;color:#7a4a2a;margin-top:4px}

.search-wrap{padding:12px 16px 0;position:relative}
.search-input{width:100%;padding:11px 42px 11px 16px;border-radius:20px;border:1.5px solid #e8ddd4;background:#fff;font-size:15px;color:#3a2e28;outline:none}
.search-clear{position:absolute;right:28px;top:50%;transform:translateY(-50%);background:none;color:#bbb;font-size:20px;padding:0;line-height:1;border:none}
.search-hint{font-size:12px;color:#888;padding:6px 16px 0}

.list{padding:12px 16px 100px}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px #0001;border:1.5px solid transparent}
.card.urg{box-shadow:0 2px 12px #e07b5422;border-color:#e07b5444}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-name{font-size:16px;font-weight:700}
.card-amt{font-size:17px;font-weight:700;color:#8b5e3c}
.card-lines{background:#fdf6ee;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.card-line{display:flex;justify-content:space-between;font-size:13px;color:#5a3e2b;padding:4px 0}
.card-line+.card-line{border-top:1px dashed #e8ddd4}
.card-meta{display:flex;gap:12px;font-size:12px;color:#888;flex-wrap:wrap;margin-bottom:4px}
.card-note{font-size:12px;color:#aaa;margin-bottom:4px}
.card-deposit{font-size:12px;color:#3a8a57;font-weight:600;margin-bottom:4px}
.card-btns{display:flex;gap:8px;margin-top:8px}
.btn-cycle{flex:2;padding:8px 0;border-radius:8px;font-weight:600;font-size:12px}
.btn-edit{flex:1;padding:8px 0;border-radius:8px;border:1px solid #ddd!important;background:#faf6f2;color:#8b5e3c;font-size:12px}
.btn-del{width:36px;border-radius:8px;border:1px solid #fdd!important;background:#fff5f5;color:#c0392b;font-size:15px}
.badge{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.veg-tag{background:#e8f5e9;color:#3a8a57;border-radius:10px;padding:1px 6px;font-size:11px;font-weight:700}
.empty{text-align:center;color:#bbb;padding:40px 0;font-size:14px}

.month-card{background:linear-gradient(135deg,#3a5a3a,#5a8a5a);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:0 3px 14px #3a5a3a22}
.month-sels{display:flex;gap:8px;margin-bottom:12px}
.month-sel{flex:1;padding:8px 10px;border-radius:10px;border:none;background:#ffffff22;color:#fff;font-size:15px;font-weight:700;outline:none;appearance:none;-webkit-appearance:none;text-align:center}
.month-lbl{font-size:12px;color:#ffffffaa;margin-bottom:4px}
.month-amt{font-size:32px;font-weight:700;color:#fff}
.month-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.month-count{font-size:12px;color:#ffffffaa}
.month-diff{font-size:12px;font-weight:600}

.fab{position:fixed;bottom:24px;right:20px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#8b5e3c,#c4a35a);color:#fff;font-size:28px;box-shadow:0 4px 16px #8b5e3c55;z-index:100;display:flex;align-items:center;justify-content:center}

.ovly{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:300}
.sheet{background:#fdf6ee;border-radius:20px 20px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:20px 16px 40px}
.sheet-bar{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 14px}
.sheet-title{font-size:18px;font-weight:700;color:#8b5e3c;text-align:center;margin-bottom:16px}

.fld{margin-bottom:14px}
.flbl{font-size:12px;color:#8b5e3c;font-weight:600;margin-bottom:6px}
.finput{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid #e8ddd4;background:#fff;font-size:16px;color:#3a2e28;outline:none;appearance:none;-webkit-appearance:none;display:block}
textarea.finput{resize:none}
.date-btn{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid #e8ddd4;background:#fff;font-size:16px;text-align:left;display:block;color:#bbb}
.date-btn.set{color:#3a2e28}
.prep-btns{display:flex;gap:6px}
.prep-btn{flex:1;padding:8px 0;border-radius:8px;background:#fff;color:#888;font-weight:600;font-size:13px}
.prep-btn.on{background:#8b5e3c;color:#fff}
.prep-hint{font-size:12px;color:#c4a35a;margin-top:6px}

.line-card{border-radius:12px;padding:12px;margin-bottom:8px;border-width:1.5px;border-style:solid}
.line-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.line-num{font-size:13px;font-weight:700}
.line-rm{background:none!important;border:none!important;color:#e07b54;font-size:20px;padding:0}
.cat-btns{display:flex;gap:6px;margin-bottom:8px}
.cat-btn{flex:1;padding:7px 0;border-radius:20px;font-size:12px;background:#f0ebe4;color:#7a5c3c}
.cat-btn.on{background:#8b5e3c;color:#fff;font-weight:700}
.veg-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer;font-size:14px;color:#3a5a3a;font-weight:600}
.veg-row input{width:20px;height:20px;accent-color:#3a8a57;cursor:pointer}
.num-row{display:flex;gap:6px;align-items:flex-end}
.num-cell{flex:1}
.num-lbl{font-size:11px;color:#aaa;margin-bottom:4px}
.num-btn{width:100%;padding:11px 8px;border-radius:10px;border:1.5px solid #e8ddd4!important;background:#fff;text-align:center;font-size:18px;font-weight:700;color:#3a2e28}
.num-sep{color:#ccc;font-size:16px;padding-bottom:11px}
.num-sub{flex:1;text-align:center;padding-bottom:10px}
.num-sub-lbl{font-size:11px;color:#aaa;margin-bottom:4px}
.num-sub-val{font-size:15px;font-weight:700}
.add-line-btn{width:100%;padding:10px 0;border-radius:10px;border:1.5px dashed #c4a35a!important;background:transparent;color:#c4a35a;font-size:14px;font-weight:600}

.total-bar{background:linear-gradient(135deg,#8b5e3c,#c4a35a);border-radius:12px;padding:14px 18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.total-lbl{font-size:14px;color:#ffffffcc;font-weight:600}
.total-amt{font-size:24px;font-weight:700;color:#fff}
.form-btns{display:flex;gap:10px}
.btn-cancel{flex:1;padding:13px 0;border-radius:12px;border:1px solid #ddd!important;background:#fff;color:#888;font-weight:600;font-size:15px}
.btn-save{flex:2;padding:13px 0;border-radius:12px;background:linear-gradient(135deg,#8b5e3c,#c4a35a);color:#fff;font-weight:700;font-size:15px}

.cal{background:#fff;border-radius:16px;padding:16px;box-shadow:0 8px 32px #0002}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-nav-btn{background:none!important;font-size:22px;color:#8b5e3c;padding:0 10px}
.cal-nav-title{font-weight:700;font-size:16px;color:#8b5e3c}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-wday{text-align:center;font-size:13px;font-weight:600;padding:4px 0}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:6px}
.cal-day{padding:9px 0;border-radius:8px;font-size:14px;background:transparent;color:#3a2e28}
.cal-day.today{background:#fff3e0;color:#e07b54;font-weight:700}
.cal-day.sel{background:#8b5e3c;color:#fff;font-weight:700}
.cal-day.empty{visibility:hidden}
.cal-cancel{width:100%;margin-top:10px;padding:10px 0;border-radius:10px;border:1px solid #ddd!important;background:#fdf6ee;color:#888;font-size:14px}

.calc-box{background:#fff;border-radius:20px;padding:16px}
.calc-title{text-align:center;font-size:13px;color:#aaa;margin-bottom:6px}
.calc-disp{background:#fdf6ee;border-radius:12px;padding:14px 16px;text-align:right;font-size:36px;font-weight:700;color:#3a2e28;margin-bottom:12px;letter-spacing:2px}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc-key{padding:18px 0;border-radius:12px;font-size:22px;font-weight:700;background:#f5f0eb;color:#3a2e28;box-shadow:0 2px 4px #0001}
.calc-key.del{font-size:20px;background:#fff8ee;color:#c4a35a}
.calc-key.clr{font-size:20px;background:#fff0ee;color:#e07b54}
.calc-key.zero{grid-column:span 2}
.calc-btns{display:flex;gap:8px;margin-top:12px}

.del-box{background:#fff;border-radius:20px;padding:24px;text-align:center}
.del-icon{font-size:40px;margin-bottom:8px}
.del-title{font-size:16px;font-weight:700;margin-bottom:6px}
.del-sub{font-size:14px;color:#888;margin-bottom:20px}
.del-btns{display:flex;gap:10px}
.btn-del-ok{flex:1;padding:13px 0;border-radius:12px;background:#e07b54;color:#fff;font-weight:700;font-size:15px}

.copy-modal-wrap{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.copy-modal{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:420px}
.copy-modal-title{font-size:16px;font-weight:700;color:#8b5e3c;margin-bottom:12px;text-align:center}
.copy-modal-text{width:100%;height:180px;border:1.5px solid #e8ddd4;border-radius:10px;padding:12px;font-size:14px;color:#3a2e28;resize:none;line-height:1.6;background:#fdf6ee}
.copy-modal-btns{display:flex;gap:10px;margin-top:12px}
.copy-modal-copy{flex:2;padding:13px 0;border-radius:12px;background:linear-gradient(135deg,#2e7d52,#52a873);color:#fff;font-weight:700;font-size:15px}
.copy-modal-close{flex:1;padding:13px 0;border-radius:12px;border:1px solid #ddd!important;background:#fff;color:#888;font-weight:600;font-size:15px}
.copy-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#2e7d52;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:999;white-space:nowrap;box-shadow:0 4px 16px #0003;pointer-events:none}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#3a2e28;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:999;white-space:nowrap;box-shadow:0 4px 16px #0003;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Constants ─────────────────────────────────────────
const CATS=['麵包','餐盒','蛋糕','其他'];
const CEMO={'麵包':'🍞','餐盒':'🥡','蛋糕':'🎂','其他':'📦'};
const STAT={pending:'待製作',making:'製作中',done:'已完成'};
const SCOL={pending:'#e07b54',making:'#c4a35a',done:'#7aab7a'};
const WDAY=['日','一','二','三','四','五','六'];
const MTHS=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const LCOL=[
  {bg:'#fff8f3',border:'#f0d5c0',bar:'#c4783a'},
  {bg:'#f3f7ff',border:'#c5d4f0',bar:'#4a6fa5'},
  {bg:'#f3fbf5',border:'#b8e0c4',bar:'#3a8a57'},
  {bg:'#fdf3ff',border:'#dfc5f0',bar:'#8a4aaa'},
];

// ── Cloud Sync ───────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw8MAmQrhPgLrp3QPOpB9-HOXsUskt_9Km5JHQP7q42CYMJZmhRYefOONOqe2HU3KVolg/exec';

function setSyncStatus(msg, autoHideMs){
  const el=document.getElementById('syncStatus');
  if(el) el.textContent=msg;
  if(autoHideMs){
    setTimeout(()=>{
      const e2=document.getElementById('syncStatus');
      if(e2 && e2.textContent===msg) e2.textContent='';
    }, autoHideMs);
  }
}

async function cloudSave(orders){
  // Show 同步中 first, then re-render and show status after fetch
  setSyncStatus('☁️ 同步中...');
  // Wait a tick so the UI updates before fetch blocks
  await new Promise(r => setTimeout(r, 50));
  try{
    await fetch(SCRIPT_URL, {
      method:'POST',
      mode:'no-cors',
      body: JSON.stringify({action:'save', orders}),
    });
    // no-cors means we can't read response, but fetch resolving = request was sent
    setSyncStatus('✓ 已同步到雲端', 3000);
  } catch(e){
    setSyncStatus('⚠️ 雲端同步失敗，已存本機', 4000);
    console.warn('雲端儲存失敗', e);
  }
}

async function cloudLoad(){
  try{
    const res = await fetch(SCRIPT_URL+'?action=load', {cache:'no-store'});
    const data = await res.json();
    if(data.ok && data.orders && data.orders.length > 0) return data.orders;
  } catch(e){ console.warn('雲端讀取失敗，使用本機資料', e); }
  return null;
}

// ── State ─────────────────────────────────────────────
let orders = (()=>{try{return JSON.parse(localStorage.getItem('bk7')||'[]')}catch{return[]}})();

// Load from cloud on startup
(async ()=>{
  const cloudOrders = await cloudLoad();
  if(cloudOrders){
    orders = cloudOrders;
    localStorage.setItem('bk7', JSON.stringify(orders));
    render();
  }
})();
let tab='all', selY=new Date().getFullYear(), selM=new Date().getMonth();
let searchQ='', editId=null, overlay=null;
let delTarget=null, calcTarget=null;
let _calY, _calM, _calcDisp='0';
let _toastTimer=null;
let lastAddedId=null;

// ── Helpers ───────────────────────────────────────────
const save = ()=>{
  localStorage.setItem('bk7', JSON.stringify(orders));
  cloudSave(orders);
};
const esc  = s=> String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const mkLine = ()=>({id:Date.now()+Math.random(), cat:'麵包', customName:'', qty:0, unitPrice:0, veg:false});
const mkForm = ()=>({client:'', lines:[mkLine()], deliveryDate:'', prepDays:1, note:'', deposit:0});
let form = mkForm();

function daysUntil(s){
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(s); d.setHours(0,0,0,0);
  return Math.ceil((d-t)/86400000);
}
function prepDate(del,n){
  const d=new Date(del); d.setDate(d.getDate()-n);
  return d.toISOString().split('T')[0];
}
function fmt(s){
  if(!s)return'';
  const d=new Date(s);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
function fmtS(s){
  if(!s)return'';
  const d=new Date(s);
  return `${d.getMonth()+1}/${d.getDate()}`;
}
const lTotal  = l=> l.qty * l.unitPrice;
const oTotal  = lines=> lines.reduce((s,l)=>s+lTotal(l), 0);
const blurAll = ()=> { if(document.activeElement) document.activeElement.blur(); };

function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  if(_toastTimer) clearTimeout(_toastTimer);
  const t=document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  _toastTimer=setTimeout(()=>t.remove(), 2000);
}

// ── HTML Builders ─────────────────────────────────────
function urgTag(days){
  if(days<0)  return `<span style="color:#c0392b;font-size:11px;font-weight:700">⚠️ 已過期</span>`;
  if(days===0)return `<span style="color:#e07b54;font-size:11px;font-weight:700">🔥 今天交貨</span>`;
  if(days===1)return `<span style="color:#c4a35a;font-size:11px;font-weight:700">⏰ 明天交貨</span>`;
  if(days<=3) return `<span style="color:#888;font-size:11px">📅 ${days} 天後</span>`;
  return        `<span style="color:#aaa;font-size:11px">📅 ${days} 天後</span>`;
}

function buildSummaryText(o){
  const lines=o.lines.map(l=>(l.veg?'[素]':'')+l.displayName+' ×'+l.qty+'（@'+l.unitPrice+'元 小計$'+lTotal(l).toLocaleString()+'）').join('\n');
  const dep=o.deposit>0?'\n💰 已付訂金：$'+o.deposit.toLocaleString()+' 元，待收 $'+Math.max(0,o.total-o.deposit).toLocaleString()+' 元':'';
  const note=o.note?'\n📝 備註：'+o.note:'';
  const prepStr=o.prepDays===0?'當日':fmt(o.prepDate)+' ('+WDAY[new Date(o.prepDate).getDay()]+')';
  return '🧁 訂單摘要\n'
    +'👤 客人：'+o.client+'\n'
    +'📦 品項：\n'+lines+'\n'
    +'💵 總金額：$'+o.total.toLocaleString()+' 元'+dep+'\n'
    +'🚚 交貨日：'+fmt(o.deliveryDate)+' ('+WDAY[new Date(o.deliveryDate).getDay()]+')\n'
    +'🔪 製作：'+prepStr+note;
}

function copyCardSummary(o){
  const text=buildSummaryText(o);
  // Show modal with text + copy button
  document.querySelectorAll('.copy-modal-wrap').forEach(m=>m.remove());
  const wrap=document.createElement('div');
  wrap.className='copy-modal-wrap';
  wrap.innerHTML=`<div class="copy-modal">
    <div class="copy-modal-title">📋 訂單摘要</div>
    <textarea class="copy-modal-text" id="copyText" readonly>${text}</textarea>
    <div class="copy-modal-btns">
      <button class="copy-modal-close" id="copyClose">關閉</button>
      <button class="copy-modal-copy" id="copyBtn">複製文字</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);

  // Select all text in textarea
  const ta=wrap.querySelector('#copyText');
  ta.focus(); ta.select();

  // Close on bg click
  wrap.addEventListener('click',e=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector('#copyClose').addEventListener('click',()=>wrap.remove());

  // Copy button - triggered by direct user click, works on iOS
  wrap.querySelector('#copyBtn').addEventListener('click',()=>{
    ta.select();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text)
        .then(()=>{ showCopyToast(); wrap.remove(); })
        .catch(()=>{ document.execCommand('copy'); showCopyToast(); wrap.remove(); });
    } else {
      document.execCommand('copy');
      showCopyToast(); wrap.remove();
    }
  });
}

function showCopyToast(){
  document.querySelectorAll('.copy-toast').forEach(t=>t.remove());
  const t=document.createElement('div');
  t.className='copy-toast'; t.textContent='✓ 已複製，可直接貼到 LINE！';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

function buildCard(o){
  const days=daysUntil(o.deliveryDate);
  const sc=SCOL[o.status];
  const stLbl=o.status==='pending'?'▶ 開始製作':o.status==='making'?'✓ 標為完成':'↩ 重新開啟';
  return `<div class="card${days<=1&&o.status!=='done'?' urg':''}" data-longpress="${o.id}">
    <div style="font-size:11px;color:#bbb;text-align:right;margin-bottom:4px">長按卡片可複製摘要</div>
    <div class="card-head">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="card-name">${esc(o.client)}</span>
        <span class="badge" style="background:${sc}22;color:${sc};border:1px solid ${sc}55">${STAT[o.status]}</span>
      </div>
      <div class="card-amt">$${o.total.toLocaleString()}</div>
    </div>
    <div class="card-lines">
      ${o.lines.map(l=>`<div class="card-line">
        <span>${CEMO[l.cat]||'📦'} ${l.veg?'<span class="veg-tag">素</span> ':''}${esc(l.displayName)} ×${l.qty}</span>
        <span style="color:#bbb">@${l.unitPrice}元</span><span> = </span><span style="color:#c4a35a;font-weight:600">$${lTotal(l).toLocaleString()}</span>
      </div>`).join('')}
    </div>
    <div class="card-meta">
      <span>🚚 交貨 ${fmtS(o.deliveryDate)}</span>
      <span>🔪 製作 ${o.prepDays===0?'當日':fmtS(o.prepDate)}</span>
      ${urgTag(days)}
    </div>
    ${o.deposit>0?`<div class="card-deposit">💰 已付訂金 $${o.deposit.toLocaleString()} 元，待收 $${Math.max(0,o.total-o.deposit).toLocaleString()} 元</div>`:''}
    ${o.note?`<div class="card-note">📝 ${esc(o.note)}</div>`:''}
    <div class="card-btns">
      <button class="btn-cycle" style="background:${sc}18;color:${sc}" data-cycle="${o.id}">${stLbl}</button>
      <button class="btn-edit" data-edit="${o.id}">✏️ 編輯</button>
      <button class="btn-del" data-del="${o.id}">🗑</button>
    </div>
  </div>`;
}

function buildApp(){
  const today=new Date(); today.setHours(0,0,0,0);
  const wEnd=new Date(today); wEnd.setDate(today.getDate()+7);

  const active  = orders.filter(o=>o.status!=='done');
  const doneOs  = orders.filter(o=>o.status==='done');
  const weekOs  = active.filter(o=>{const d=new Date(o.deliveryDate);d.setHours(0,0,0,0);return d>=today&&d<=wEnd;});
  const prepT   = active.filter(o=>{const p=new Date(o.prepDate);p.setHours(0,0,0,0);return p<=today&&new Date(o.deliveryDate)>=today;});

  // Done tab: year/month filter + search
  const thisY   = today.getFullYear();
  const doneYs  = [...new Set(doneOs.map(o=>new Date(o.deliveryDate).getFullYear()))].sort((a,b)=>b-a);
  if(!doneYs.includes(thisY)) doneYs.unshift(thisY);
  const doneSel = doneOs.filter(o=>{const d=new Date(o.deliveryDate);return d.getFullYear()===selY&&d.getMonth()===selM;});
  const selTot  = doneSel.reduce((s,o)=>s+o.total,0);
  const prvDate = new Date(selY,selM-1,1);
  const prvTot  = doneOs.filter(o=>{const d=new Date(o.deliveryDate);return d.getFullYear()===prvDate.getFullYear()&&d.getMonth()===prvDate.getMonth();}).reduce((s,o)=>s+o.total,0);
  const mDiff   = prvTot>0?Math.round((selTot-prvTot)/prvTot*100):null;

  // Apply search (done tab only)
  const baseOs  = tab==='all'?active:tab==='week'?weekOs:doneSel;
  const listOs  = (tab==='done'&&searchQ)
    ? baseOs.filter(o=>{
        const q=searchQ.toLowerCase();
        return o.client.toLowerCase().includes(q)
          ||(o.note||'').toLowerCase().includes(q)
          ||o.lines.some(l=>l.displayName.toLowerCase().includes(q)||(l.customName||'').toLowerCase().includes(q));
      })
    : baseOs;
  const sorted  = [...listOs].sort((a,b)=>new Date(a.deliveryDate)-new Date(b.deliveryDate));

  return `
  <div class="hdr">
    <div class="hdr-icon">🧁</div>
    <div class="hdr-title">訂單管理</div>
    <div id="syncStatus" style="font-size:11px;color:#ffffffcc;margin-bottom:2px;min-height:14px;font-weight:600"></div>
  <div class="hdr-date">${today.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</div>
  </div>

  ${prepT.length?`<div class="prep-box">
    <div class="prep-title">🔔 今天要開始製作的訂單</div>
    ${prepT.map(o=>`<div class="prep-row">• ${esc(o.client)} — ${o.lines.map(l=>`${l.displayName}×${l.qty}`).join('、')} → 交貨：${fmtS(o.deliveryDate)}</div>`).join('')}
  </div>`:''}

  <div class="stats">
    <div class="stat" style="border-top:3px solid #e07b54"><div class="stat-val" style="color:#e07b54">${active.length}</div><div class="stat-lbl">進行中</div></div>
    <div class="stat" style="border-top:3px solid #c4a35a"><div class="stat-val" style="color:#c4a35a">${weekOs.length}</div><div class="stat-lbl">本週交貨</div></div>
    <div class="stat" style="border-top:3px solid #7aab7a"><div class="stat-val" style="color:#7aab7a">${doneOs.length}</div><div class="stat-lbl">已完成</div></div>
  </div>

  ${lastAddedId?`<div style="margin:10px 16px 0;background:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px #0001;border-left:4px solid #c4a35a">
    <span style="font-size:13px;color:#8b5e3c;font-weight:600">🧁 剛剛新增的訂單</span>
    <div style="display:flex;gap:8px">
      <button id="viewLastBtn" style="padding:6px 12px;border-radius:20px;background:#8b5e3c;color:#fff;font-size:12px;font-weight:600">查看</button>
      <button id="dismissLastBtn" style="padding:6px 10px;border-radius:20px;background:#f0ebe4;color:#888;font-size:12px">✕</button>
    </div>
  </div>`:''}

  <div class="tabs">
    <button class="tab${tab==='all'?' on':''}" data-tab="all">全部</button>
    <button class="tab${tab==='week'?' on':''}" data-tab="week">本週</button>
    <button class="tab${tab==='done'?' on':''}" data-tab="done">已完成</button>
  </div>

  ${tab==='done'?`
  <div class="search-wrap">
    <input class="search-input" id="searchBox" placeholder="🔍 搜尋客人、品項、備註..." value="${esc(searchQ)}">
    ${searchQ?`<button class="search-clear" id="searchClear">×</button>`:''}
  </div>
  ${searchQ?`<div class="search-hint">${sorted.length?`找到 ${sorted.length} 筆含「${esc(searchQ)}」的訂單`:`沒有找到含「${esc(searchQ)}」的訂單`}</div>`:''}
  `:''}

  <div class="list">
    ${tab==='done'?`<div class="month-card">
      <div class="month-sels">
        <select class="month-sel" id="selY">${doneYs.map(y=>`<option value="${y}"${y===selY?' selected':''}>${y}年</option>`).join('')}</select>
        <select class="month-sel" id="selM">${MTHS.map((m,i)=>`<option value="${i}"${i===selM?' selected':''}>${m}</option>`).join('')}</select>
      </div>
      <div class="month-lbl">${selY}年${selM+1}月 完成收入</div>
      <div class="month-amt">$${selTot.toLocaleString()} 元</div>
      <div class="month-foot">
        <div class="month-count">共 ${doneSel.length} 筆訂單</div>
        ${mDiff!==null?`<div class="month-diff" style="color:${mDiff>=0?'#a8e6a8':'#ffaaaa'}">${mDiff>=0?'▲':'▼'} ${Math.abs(mDiff)}% 較上月</div>`:''}
      </div>
    </div>`:''}

    ${sorted.length===0?`<div class="empty">${tab==='done'?'這個月還沒有完成的訂單':'目前沒有訂單 🎉'}</div>`:''}
    ${sorted.map(buildCard).join('')}
  </div>

  <button class="fab" id="fabBtn">+</button>
  ${overlay==='form'?buildForm():''}
  ${overlay==='cal'?buildCal():''}
  ${overlay==='calc'?buildCalc():''}
  ${overlay==='del'?buildDel():''}`;
}

      <button class="add-line-btn" id="addLine">＋ 新增品項</button>

    <div class="total-bar">

    <div class="fld">

      <button class="num-btn" id="depositBtn" style="width:100%;text-align:center;font-size:18px;font-weight:700">
        ${form.deposit>0?`$${form.deposit.toLocaleString()} 元`:'0（點此輸入）'}
      </button>
      ${form.deposit>0?`<div style="font-size:12px;color:#3a8a57;margin-top:6px;font-weight:600">✓ 已收訂金 $${form.deposit.toLocaleString()} 元，待收 $${Math.max(0,fTot-form.deposit).toLocaleString()} 元</div>`:''}

    <div class="fld">

    <div class="form-btns">

function buildCal(){
  const base = form.deliveryDate ? new Date(form.deliveryDate) : new Date();
  if(_calY===undefined){_calY=base.getFullYear(); _calM=base.getMonth();}
  const tod=new Date(); tod.setHours(0,0,0,0);
  const fd=new Date(_calY,_calM,1).getDay();
  const dm=new Date(_calY,_calM+1,0).getDate();
  let cells='';
  for(let i=0;i<fd;i++) cells+=`<button class="cal-day empty"> </button>`;
  for(let d=1;d<=dm;d++){
    const sel=form.deliveryDate&&new Date(form.deliveryDate).getFullYear()===_calY&&new Date(form.deliveryDate).getMonth()===_calM&&new Date(form.deliveryDate).getDate()===d;
    const isT=tod.getFullYear()===_calY&&tod.getMonth()===_calM&&tod.getDate()===d;
    const dateStr=`${_calY}-${String(_calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells+=`<button class="cal-day${sel?' sel':isT?' today':''}" data-pick="${dateStr}">${d}</button>`;
  }
  return `<div class="ovly" id="ovly">
  <div class="sheet" style="max-height:70vh">
    <div class="cal">
      <div class="cal-nav">
        <button class="cal-nav-btn" id="calPrev">‹</button>
        <span class="cal-nav-title">${_calY}年 ${MTHS[_calM]}</span>
        <button class="cal-nav-btn" id="calNext">›</button>
      </div>
      <div class="cal-grid">
        ${WDAY.map((w,i)=>`<div class="cal-wday" style="color:${i===0?'#e07b54':i===6?'#c4a35a':'#aaa'}">${w}</div>`).join('')}
      </div>
      <div class="cal-days">${cells}</div>
      <button class="cal-cancel" id="calCancel">取消</button>
    </div>
  </div>
</div>`;
}

function buildCalc(){
  const isDeposit = calcTarget&&calcTarget.field==='deposit';
  const title = isDeposit ? '已付訂金（元）'
    : calcTarget ? `品項 ${calcTarget.lineIdx+1} ${calcTarget.field==='qty'?'數量':'單價（元）'}` : '';
  const keys=[7,8,9,'⌫',4,5,6,'C',1,2,3,null,0,null,null,null];
  let kHTML='';
  keys.forEach(k=>{
    if(k===null){kHTML+=`<div></div>`;return;}
    const cls=k==='⌫'?' del':k==='C'?' clr':'';
    kHTML+=`<button class="calc-key${cls}${k===0?' zero':''}" data-k="${k}">${k}</button>`;
  });
  return `<div class="ovly" id="ovly">
  <div class="sheet" style="max-height:80vh">
    <div class="calc-box">
      <div class="calc-title">${title}</div>
      <div class="calc-disp" id="calcDisp">${Number(_calcDisp).toLocaleString()}</div>
      <div class="calc-keys">${kHTML}</div>
      <div class="calc-btns">
        <button class="btn-cancel" id="calcCancel">取消</button>
        <button class="btn-save" id="calcOk">確認</button>
      </div>
    </div>
  </div>
</div>`;
}

function buildDel(){
  return `<div class="ovly" id="ovly">
  <div class="sheet" style="max-height:50vh">
    <div class="del-box">
      <div class="del-icon">🗑️</div>
      <div class="del-title">確定要刪除？</div>
      <div class="del-sub">「${delTarget?esc(delTarget.client):''}」的訂單將永久刪除</div>
      <div class="del-btns">
        <button class="btn-cancel" id="delCancel">取消</button>
        <button class="btn-del-ok" id="delOk">刪除</button>
      </div>
    </div>
  </div>
</div>`;
}

// ── Render ────────────────────────────────────────────
function render(){
  document.getElementById('app').innerHTML = buildApp();
  bind();
}

// ── Sync form fields before saving ────────────────────
function syncForm(){
  const c=document.getElementById('fClient'); if(c) form.client=c.value;
  const n=document.getElementById('fNote');   if(n) form.note=n.value;
  document.querySelectorAll('[data-cname]').forEach(el=>{ form.lines[+el.dataset.cname].customName=el.value; });
  document.querySelectorAll('[data-veg]').forEach(cb=>{ form.lines[+cb.dataset.veg].veg=cb.checked; });
}

// ── Event binding ─────────────────────────────────────
function bind(){
  const $=id=>document.getElementById(id);
  const $$=sel=>document.querySelectorAll(sel);

  // Tabs
  $$('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ tab=b.dataset.tab; searchQ=''; render(); }));

  // Last added banner
  const vlb=$('viewLastBtn');
  if(vlb) vlb.addEventListener('click',()=>{
    const o=orders.find(x=>x.id===lastAddedId);
    if(!o) return;
    tab = o.status==='done' ? 'done' : 'all';
    searchQ=''; render();
    setTimeout(()=>{
      const el=document.querySelector('[data-cycle="'+lastAddedId+'"]');
      if(el) el.closest('.card').scrollIntoView({behavior:'smooth',block:'center'});
    },150);
  });
  const dlb=$('dismissLastBtn');
  if(dlb) dlb.addEventListener('click',()=>{ lastAddedId=null; render(); });

  // Long-press to copy summary
  document.querySelectorAll('[data-longpress]').forEach(card=>{
    let timer=null;
    const id=card.dataset.longpress;
    const start=()=>{ timer=setTimeout(()=>{ const o=orders.find(x=>x.id===id); if(o) copyCardSummary(o); }, 600); };
    const cancel=()=>{ clearTimeout(timer); };
    card.addEventListener('touchstart', start, {passive:true});
    card.addEventListener('touchend',   cancel);
    card.addEventListener('touchmove',  cancel);
    card.addEventListener('mousedown',  start);
    card.addEventListener('mouseup',    cancel);
    card.addEventListener('mouseleave', cancel);
  });

  // Month selectors
  const sy=$('selY'), sm=$('selM');
  if(sy) sy.addEventListener('change',()=>{ selY=+sy.value; render(); });
  if(sm) sm.addEventListener('change',()=>{ selM=+sm.value; render(); });

  // Search (done tab only) — IME-safe
  const sb=$('searchBox');
  if(sb){
    let composing=false;
    sb.addEventListener('compositionstart',()=>{ composing=true; });
    sb.addEventListener('compositionend',  ()=>{ composing=false; searchQ=sb.value; render(); });
    sb.addEventListener('input',           ()=>{ if(!composing){ searchQ=sb.value; render(); } });
    sb.focus();
    sb.setSelectionRange(sb.value.length, sb.value.length);
  }
  const sc=$('searchClear');
  if(sc) sc.addEventListener('click',()=>{ searchQ=''; render(); });

  // Order actions
  $$('[data-cycle]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.cycle;
    orders=orders.map(o=>{ if(o.id!==id)return o; const n=o.status==='pending'?'making':o.status==='making'?'done':'pending'; return{...o,status:n}; });
    save(); render();
  }));
  $$('[data-edit]').forEach(b=>b.addEventListener('click',()=>{
    const o=orders.find(x=>x.id===b.dataset.edit); if(!o)return;
    editId=o.id;
    form={client:o.client, lines:o.lines.map(l=>({...l,customName:l.cat==='其他'&&l.displayName!=='其他'?l.displayName:'',veg:l.veg||false})), deliveryDate:o.deliveryDate, prepDays:o.prepDays, note:o.note||'', deposit:o.deposit||0};
    overlay='form'; render();
  }));
  $$('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    delTarget=orders.find(x=>x.id===b.dataset.del)||null;
    overlay='del'; render();
  }));

  // FAB
  const fab=$('fabBtn');
  if(fab) fab.addEventListener('click',()=>{ editId=null; form=mkForm(); overlay='form'; render(); });

  // Overlay bg close
  const ovly=$('ovly');
  if(ovly) ovly.addEventListener('click',e=>{ if(e.target===ovly){ overlay=null; render(); } });

  // Form: date picker — blur first to dismiss keyboard
  const dp=$('datePick');
  if(dp) dp.addEventListener('click',()=>{ blurAll(); syncForm(); _calY=undefined; _calM=undefined; overlay='cal'; render(); });

  // Form: prep days — blur first
  $$('[data-prep]').forEach(b=>b.addEventListener('click',()=>{ blurAll(); syncForm(); form.prepDays=+b.dataset.prep; render(); }));

  // Form: open calc for line — blur first
  $$('[data-calc]').forEach(b=>b.addEventListener('click',()=>{
    blurAll(); syncForm();
    const [i,field]=b.dataset.calc.split(':');
    calcTarget={lineIdx:+i, field};
    _calcDisp=String(form.lines[+i][field]);
    overlay='calc'; render();
  }));

  // Form: deposit — blur first
  const dep=$('depositBtn');
  if(dep) dep.addEventListener('click',()=>{ blurAll(); syncForm(); calcTarget={lineIdx:-1,field:'deposit'}; _calcDisp=String(form.deposit||0); overlay='calc'; render(); });

  // Form: add/remove line
  const al=$('addLine');
  if(al) al.addEventListener('click',()=>{ syncForm(); form.lines.push(mkLine()); render(); });
  $$('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ syncForm(); form.lines.splice(+b.dataset.rm,1); render(); }));

  // Form: cat select
  $$('[data-cat]').forEach(b=>b.addEventListener('click',()=>{
    blurAll(); syncForm();
    const [i,cat]=b.dataset.cat.split(':');
    form.lines[+i].cat=cat; render();
  }));

  // Form: veg checkbox
  $$('[data-veg]').forEach(cb=>cb.addEventListener('change',()=>{ form.lines[+cb.dataset.veg].veg=cb.checked; }));

  // Form: custom name live sync
  $$('[data-cname]').forEach(el=>el.addEventListener('input',()=>{ form.lines[+el.dataset.cname].customName=el.value; }));

  // Form: cancel / save
  const fc=$('formCancel');
  if(fc) fc.addEventListener('click',()=>{ overlay=null; editId=null; render(); });
  const fs=$('formSave');
  if(fs) fs.addEventListener('click',()=>{
    syncForm();
    if(!form.client.trim()||!form.deliveryDate){ toast('請填寫客人姓名和交貨日期！'); return; }
    const pd=form.prepDays===0?form.deliveryDate:prepDate(form.deliveryDate,form.prepDays);
    const t=oTotal(form.lines);
    const o={
      id: editId||Date.now().toString(),
      client: form.client.trim(),
      lines: form.lines.map(l=>({...l, displayName:l.cat==='其他'&&l.customName.trim()?l.customName.trim():l.cat})),
      total: t, deliveryDate: form.deliveryDate, prepDate: pd, prepDays: form.prepDays,
      note: form.note.trim(), deposit: form.deposit||0,
      status: editId?(orders.find(x=>x.id===editId)?.status||'pending'):'pending',
      createdAt: editId?(orders.find(x=>x.id===editId)?.createdAt||Date.now()):Date.now(),
    };
    orders = editId ? orders.map(x=>x.id===editId?o:x) : [o,...orders];
    const wasEdit=!!editId;
    const newId=o.id;
    save(); overlay=null; editId=null; form=mkForm();
    if(!wasEdit) lastAddedId=newId;
    else lastAddedId=null;
    toast(wasEdit?'訂單已更新 ✓':'訂單已新增 ✓'); render();
  });

  // Calendar nav / pick / cancel
  const cp=$('calPrev');
  if(cp) cp.addEventListener('click',()=>{ if(_calM===0){_calY--;_calM=11;}else _calM--; render(); });
  const cn=$('calNext');
  if(cn) cn.addEventListener('click',()=>{ if(_calM===11){_calY++;_calM=0;}else _calM++; render(); });
  $$('[data-pick]').forEach(b=>b.addEventListener('click',()=>{ form.deliveryDate=b.dataset.pick; overlay='form'; render(); }));
  const cc=$('calCancel');
  if(cc) cc.addEventListener('click',()=>{ overlay='form'; render(); });

  // Calculator keys (direct DOM update — no re-render needed)
  $$('[data-k]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.k;
    if(k==='C') _calcDisp='0';
    else if(k==='⌫') _calcDisp=_calcDisp.length>1?_calcDisp.slice(0,-1):'0';
    else if(_calcDisp==='0') _calcDisp=k;
    else if(_calcDisp.length<6) _calcDisp+=k;
    const disp=$('calcDisp');
    if(disp) disp.textContent=Number(_calcDisp).toLocaleString();
  }));
  const calcCancel=$('calcCancel');
  if(calcCancel) calcCancel.addEventListener('click',()=>{ overlay='form'; render(); });
  const calcOk=$('calcOk');
  if(calcOk) calcOk.addEventListener('click',()=>{
    const v=parseInt(_calcDisp)||0;
    if(calcTarget.field==='deposit') form.deposit=Math.max(0,v);
    else form.lines[calcTarget.lineIdx][calcTarget.field]=Math.max(0,v);
    overlay='form'; render();  // form data preserved in JS object, no syncForm needed here
  });

  // Delete cancel / confirm
  const dc=$('delCancel');
  if(dc) dc.addEventListener('click',()=>{ overlay=null; delTarget=null; render(); });
  const dok=$('delOk');
  if(dok) dok.addEventListener('click',()=>{
    orders=orders.filter(o=>o.id!==delTarget.id);
    save(); overlay=null; delTarget=null; toast('已刪除'); render();
  });
}

render();
</script>
</body>
</html>
